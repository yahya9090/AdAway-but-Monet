name: Build Both APKs (Persistent Keys)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Generate Deterministic Persistent Keystores
        run: |
          mkdir -p ~/.android
          cat << 'EOF' > GenKey.java
          import java.io.*;
          import java.security.*;
          import sun.security.tools.keytool.Main;

          public class GenKey {
              public static class SeededProvider extends Provider {
                  public SeededProvider() {
                      super("Seeded", 1.0, "Deterministic PRNG");
                      put("SecureRandom.SHA1PRNG", SeededRandom.class.getName());
                  }
              }
              public static class SeededRandom extends SecureRandomSpi {
                  private final MessageDigest md;
                  private byte[] state;
                  private int counter = 0;
                  public SeededRandom() {
                      try {
                          md = MessageDigest.getInstance("SHA-256");
                          String seed = System.getenv("KEY_SEED");
                          state = md.digest((seed != null ? seed : "adaway-monet").getBytes("UTF-8"));
                      } catch (Exception e) { throw new RuntimeException(e); }
                  }
                  protected void engineSetSeed(byte[] seed) {}
                  protected void engineNextBytes(byte[] bytes) {
                      int off = 0;
                      while (off < bytes.length) {
                          md.update(state);
                          md.update((byte)(counter >> 24));
                          md.update((byte)(counter >> 16));
                          md.update((byte)(counter >> 8));
                          md.update((byte)counter++);
                          byte[] out = md.digest();
                          int len = Math.min(bytes.length - off, out.length);
                          System.arraycopy(out, 0, bytes, off, len);
                          off += len;
                      }
                  }
                  protected byte[] engineGenerateSeed(int numBytes) {
                      byte[] b = new byte[numBytes];
                      engineNextBytes(b);
                      return b;
                  }
              }
              public static void main(String[] args) throws Exception {
                  Security.insertProviderAt(new SeededProvider(), 1);
                  Main.main(args);
              }
          }
          EOF

          javac --add-exports java
