name: Build APKs (Unsigned Release + Debug)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Optimized Unsigned Release APKs
        run: ./gradlew assembleDebug assembleRelease -x lint -x lintVitalRelease --stacktrace

      - name: Zipalign Unsigned Release APK and Collect Outputs
        run: |
          mkdir -p output-apks
          
          # Copy Debug APK
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output-apks/AdAway-Monet-Debug.apk \;
          
          # Zipalign the unsigned Release APK so it's ready for local signing
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -n "$UNSIGNED_APK" ]; then
            $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" output-apks/AdAway-Monet-Release-Unsigned.apk
          fi
          
          ls -lh output-apks/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AdAway-Monet-APKs
          path: output-apks/*.apk
